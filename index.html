<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACRF · Safety stock sized to the data you have</title>
<meta name="description" content="ACRF (Adaptive Capacity &amp; Risk Framework) sizes safety stock to the demand history a small or mid-sized business actually has, learns from forecast error and scores capacity risk from 0 to 100. Everything runs in your browser.">
<meta name="theme-color" content="#ffffff">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#ffffff;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:#1c5cab;text-decoration:none}a:hover{color:#104281}
button,input,select{font-family:inherit}
#app{min-height:100vh;overflow-x:clip}
p,h1,h2,h3,h4,li,blockquote{font-feature-settings:'tnum' 0}
section[id],main[id]{scroll-margin-top:72px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.glass{background-color:var(--glassBg);background-image:linear-gradient(135deg,var(--glassSheen) 0%,rgba(255,255,255,0) 46%);border:1px solid var(--glassBorder);box-shadow:var(--glassShadow);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.glassNav{background:var(--navBg);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}
.glassBtn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.42);box-shadow:inset 0 1px 0 rgba(255,255,255,0.35);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);transition:background-color .2s ease}
.glassBtn:hover{background:rgba(255,255,255,0.22)!important}
.orb{position:absolute;border-radius:50%;filter:blur(38px);pointer-events:none;will-change:transform}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1);border-radius:50%}33%{transform:translate(22px,-16px) scale(1.08);border-radius:42% 58% 55% 45%/48% 44% 56% 52%}66%{transform:translate(-18px,14px) scale(.94);border-radius:58% 42% 45% 55%/52% 58% 42% 48%}}
@keyframes introWord{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes introShine{from{background-position:100% 0}to{background-position:0 0}}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass{background-color:var(--surface)}.glassNav{background:var(--page)}}
.boot{min-height:100vh;display:grid;place-items:center;font:600 13px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#475467}
@media (max-width: 640px){
  .gut{padding-left:16px!important;padding-right:16px!important}
  .brow{grid-template-columns:96px minmax(0,1fr) 84px!important;gap:10px!important;padding-left:4px!important;padding-right:4px!important}
  .h1x{font-size:38px!important}
  .introTag{font-size:18px!important;padding:0 8px}
  .h2x{font-size:28px!important}
  .heroArt{height:440px!important}
  .hmain{left:0!important;top:128px!important;width:100%!important}
  .hcap{right:0!important;top:0!important}
  .hside{display:none!important}
  .ctaBand{padding:28px!important}
  .axl:not(:first-child):not(:last-child){display:none}
  .navlinks{display:none!important}
  .wmsub{display:none!important}
  header nav{column-gap:10px!important}
  .navcta{height:38px!important;padding:0 14px!important;font-size:13px!important}
  .tipbox{position:fixed!important;left:16px!important;right:16px!important;top:auto!important;bottom:16px!important;width:auto!important}
  [id^="ex-"][role="dialog"]{position:fixed!important;left:12px!important;right:12px!important;top:auto!important;bottom:12px!important;width:auto!important;max-height:70vh;overflow:auto;z-index:150!important}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{.noprint{display:none!important}body{background:#ffffff!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-34px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spinin{from{opacity:0;transform:rotate(-90deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes wave{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.th{transition:background-color .35s ease,border-color .35s ease,color .35s ease}
.kpi{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s ease,background-color .35s ease,border-color .35s ease}
.rw:hover{background:var(--tint)}
.hov:hover{background:var(--tint)!important}
.chip:hover{border-color:var(--faint)!important}
.rowbtn::after{content:"";position:absolute;inset:0}
.rowbtn:focus-visible{outline:none}
.rw:focus-within{box-shadow:inset 0 0 0 2px var(--acrf)}
.tipbox{opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease,visibility .15s}
.tipwrap:hover .tipbox,.tipwrap:focus-within .tipbox{opacity:1;visibility:visible;transform:none}
.ibtn:hover,.ibtn:focus-visible{color:var(--acrf)!important}
.exbtn:hover{border-color:var(--acrf)!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.filelbl:hover{background:var(--tint)!important}
.optchip:hover{border-color:var(--acrf)!important}
@keyframes bDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes bPop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes bDrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes bFade{from{opacity:0}to{opacity:1}}
@keyframes bNeedle{from{transform:rotate(-100deg)}60%{transform:rotate(12deg)}to{transform:none}}
@keyframes bSpin{from{opacity:0;transform:rotate(-160deg)}to{opacity:1;transform:none}}
@keyframes bGrow{from{transform:scaleY(0)}to{transform:none}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
@keyframes dotin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes tilein{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.brandlink:hover{background:var(--tint)}
input[type=range]{accent-color:var(--acrf)}
button:focus-visible{outline:2px solid var(--acrf);outline-offset:2px}
@media print{.noprint{display:none!important}}
@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.btnP{transition:background-color .2s ease,transform .2s ease}
.btnP:hover{background:var(--acrfDeep)!important;color:#ffffff!important;transform:translateY(-1px)}
.btnS{transition:background-color .2s ease,border-color .2s ease}
.btnS:hover{background:var(--tint)!important;color:var(--ink)!important}
.btnW:hover{background:#eef4fd!important;color:#104281!important}
.btnO:hover{background:rgba(255,255,255,0.12)!important;color:#ffffff!important}
.navl:hover{color:var(--ink)!important;background:var(--tint)}
.lift{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease,border-color .3s ease}
.lift:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.chipb:hover{border-color:var(--acrf)!important}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acrf);outline-offset:3px}
@keyframes introWave{0%{opacity:.5;transform:scale(.8)}100%{opacity:0;transform:scale(1.65)}}
@keyframes introSpin{to{transform:rotate(360deg)}}
@keyframes introMark{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes introLetter{from{opacity:0;transform:translateY(30px) rotateX(-75deg)}to{opacity:1;transform:none}}
@keyframes introUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes introDot{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes introBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes introOut{from{opacity:1}to{opacity:0;visibility:hidden}}
@keyframes introLift{from{transform:none}to{transform:translateY(-28px) scale(1.04)}}
@keyframes popin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes flash{0%{background:var(--acrfTint)}100%{background:var(--surface)}}
.usebtn:hover{background:var(--acrf)!important;color:#ffffff!important}
</style>
</head>

<section id="how" class="gut" style="max-width: 1240px; margin: 0 auto; padding: 88px 32px; box-sizing: border-box">
<div style="max-width: 760px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acrfText)">How ACRF works</div>
<h2 class="h2x" style="margin: 12px 0 0; font-size: 40px; line-height: 1.12; font-weight: 800; letter-spacing: -0.03em">Three adjustments, one framework</h2>
<p style="margin: 16px 0 0; font-size: 18px; line-height: 1.6; color: var(--sec)">ACRF keeps the classical formula and adds the three corrections a data-light business needs.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 40px">

<div class="lift" style="border: 1px solid var(--line); border-radius: 22px; background: var(--surface); overflow: hidden">
<div style="height: 190px; background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<svg viewBox="0 0 320 150" aria-hidden="true" style="width: 100%; max-width: 320px; height: auto; overflow: visible">

<path d=${V.howArea} fill="var(--acrfSoft)"></path>
<path d=${V.howPath} fill="none" stroke="var(--acrf)" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" style="animation: draw 1.6s .3s cubic-bezier(.4,0,.2,1) both"></path>
<circle cx=${V.howX} cy=${V.howY} r="6" fill="var(--acrf)" stroke="var(--surface)" stroke-width="2.5"></circle>
<text x=${V.howLx} y=${V.howLy} style="font-size: 11px; font-weight: 600; fill: var(--ink)">147 days → 0.758</text>
<text x="20" y="148" style="font-size: 11px; fill: var(--muted)">0 days</text>
<text x="304" y="148" text-anchor="end" style="font-size: 11px; fill: var(--muted)">850</text>
</svg>
</div>
<div style="padding: 24px 26px 28px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--acrf); color: #ffffff; display: grid; place-items: center; font-size: 13px; font-weight: 700">1</span><h3 style="margin: 0; font-size: 19px; font-weight: 700">Adjusts for data depth</h3></div>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: var(--sec)">A confidence factor, c(n), scales the buffer between 50% and 100% of the classical level as your demand history grows toward a 730-day benchmark.</p>
<code style="display: inline-block; margin-top: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--acrfText); background: var(--acrfTint); border-radius: 8px; padding: 6px 10px">SS = z · c(n) · √(L·σD² + D²·σL²)</code>
</div>
</div>

<div class="lift" style="border: 1px solid var(--line); border-radius: 22px; background: var(--surface); overflow: hidden">
<div style="height: 190px; background: var(--panel); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
<svg viewBox="0 0 320 150" aria-hidden="true" style="width: 100%; max-width: 320px; height: auto; overflow: visible">
<rect x="8" y="52" width="86" height="46" rx="12" fill="var(--surface)" stroke="var(--line2)"></rect>
<text x="51" y="72" text-anchor="middle" style="font-size: 12px; font-weight: 600; fill: var(--ink)">Forecast</text>
<text x="51" y="88" text-anchor="middle" style="font-size: 10.5px; fill: var(--muted)">5-day average</text>
<rect x="117" y="52" width="86" height="46" rx="12" fill="var(--fcTint)" stroke="var(--fc)"></rect>
<text x="160" y="72" text-anchor="middle" style="font-size: 12px; font-weight: 600; fill: var(--fcText)">Error</text>
<text x="160" y="88" text-anchor="middle" style="font-size: 10.5px; fill: var(--fcText)">30-day MAPE</text>
<rect x="226" y="52" width="86" height="46" rx="12" fill="var(--acrfTint)" stroke="var(--acrf)"></rect>
<text x="269" y="72" text-anchor="middle" style="font-size: 12px; font-weight: 600; fill: var(--acrfText)">c(n)</text>

<path d="M96 75h18M205 75h18" stroke="var(--faint)" stroke-width="2" stroke-dasharray="4 4" style="animation: flow 1.2s linear infinite"></path>
<path d="M110 70l6 5-6 5M219 70l6 5-6 5" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M269 100C269 136 51 136 51 100" fill="none" stroke="var(--acrf)" stroke-width="2" stroke-dasharray="4 4" style="animation: flow 1.2s linear infinite"></path>
<path d="M45 106l6-7 6 7" fill="none" stroke="var(--acrf)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="160" y="146" text-anchor="middle" style="font-size: 11px; fill: var(--muted)">each period feeds the next</text>
<text x="160" y="34" text-anchor="middle" style="font-size: 11px; font-weight: 600; fill: var(--ink2)">factor = max(0.8, 1 − MAPE ÷ 200)</text>

<div style="padding: 24px 26px 28px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 8px; background: var(--fc); color: #ffffff; display: grid; place-items: center; font-size: 13px; font-weight: 700">2</span><h3 style="margin: 0; font-size: 19px; font-weight: 700">Learns from forecast error</h3></div>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: var(--sec)">A rolling forecast-error measure feeds back into c(n), so the recommendation responds as forecast accuracy changes instead of being set once.</p>
<code style="display: inline-block; margin-top: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--fcText); background: var(--fcTint); border-radius: 8px; padding: 6px 10px">c′ = c(n) · max(0.8, 1 − MAPE/200)</code>

<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: var(--sec)">On-time delivery, forecast reliability and carrier concentration combine into one 0–100 score per category, with clear bands an operator can act on.</p>
<code style="display: inline-block; margin-top: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--violetText); background: var(--violetTint); border-radius: 8px; padding: 6px 10px">CCRS = 0.40·U + 0.35·F + 0.25·D</code>

<p style="margin: 22px 0 0; font-size: 17px; line-height: 1.75; color: var(--ink2)">Debo has worked on both sides of a divide most supply-chain tools ignore. In Lagos she grew fast-moving businesses with lean teams: Konga, one of Africa's leading e-commerce companies, and Kobo360, an e-logistics company moving freight across the continent. In the United States she joined Amazon, one of the most data-rich operations in the world.</p>
<p style="margin: 16px 0 0; font-size: 17px; line-height: 1.75; color: var(--ink2)">The contrast kept showing up in the numbers. The textbook safety-stock and forecast-accuracy formulas work well where there are years of clean history and analysts to maintain them. Small and mid-sized businesses rarely have either; most have a year or two of usable data. Applied as-is, the formulas either lock up cash a small firm cannot spare or leave its shelves empty.</p>

<p style="margin: 0; font-size: 17px; line-height: 1.75; color: var(--ink2)">Rather than replace the classical formula, she kept it and added three adjustments: a confidence factor that sizes the buffer to the history a business actually has, a feedback loop that responds to forecast error, and one 0–100 capacity-risk score an owner can act on without a statistics degree. On public supply-chain data it held 24% less safety stock across five categories, and she paired it with a backtest that shows plainly what each saving costs in fill rate.</p>

/* ---------------- App shell: routing, theme, sample data ---------------- */
// Logo direction from the brand board: curve | stack | gauge | monogram | loop | network
var LOGO = 'curve';
// The sample dataset ships with the repo; the GitHub copy is a fallback when the page is opened from disk.
var SAMPLE_SOURCES = ['data/dataco_us_consumer.csv', 'https://raw.githubusercontent.com/AdeboJ/logidata-acrf-framework/main/data/dataco_us_consumer.csv'];
var samplePromise = null;
function loadSampleText() {
  if (!samplePromise) {
    samplePromise = SAMPLE_SOURCES.reduce(function (prev, url) {
      return prev.catch(function () { return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }); });
    }, Promise.reject(new Error('start'))).catch(function () { samplePromise = null; throw new Error('the sample file could not be downloaded'); });
  }
  return samplePromise;
}
function parseRoute(hash) {
  var h = String(hash || '').replace(/^#/, '');
  if (h === '/dashboard' || h.indexOf('/dashboard/') === 0) {
    var sub = h.slice('/dashboard'.length).replace(/^\//, '');
    return {view: 'dash', tab: sub === 'backtest' ? 'backtest' : sub === 'service-levels' ? 'service' : 'overview', anchor: null};
  }
  if (h === '/developer' || h.indexOf('/developer/') === 0) {
    var part = h.slice('/developer'.length).replace(/^\//, '');
    return {view: 'profile', tab: null, anchor: part || null};
  }
  if (h === '' || h === '/') return {view: 'landing', tab: null, anchor: null};
  return {view: 'landing', tab: null, anchor: h.replace(/^\//, '')};
}
function savedTheme() { try { return localStorage.getItem('acrf-theme') === 'dark'; } catch (err) { return false; } }
var TITLES = {overview: 'Overview', backtest: 'Backtest', service: 'Service levels'};

class App extends PreactComponent {
  constructor(props) {
    super(props);
    var r = parseRoute(location.hash);
    this.state = {route: r, dark: savedTheme()};
    this.playIntro = r.view === 'landing' && !r.anchor;
    this.setDark = this.setDark.bind(this);
  }
  componentDidMount() {
    var self = this;
    this.onHash = function () { self.go(); };
    window.addEventListener('hashchange', this.onHash);
    loadSampleText().catch(function () { /* the dashboard reports this when it opens */ });
    this.paint();
    var r = this.state.route;
    if (r.anchor) setTimeout(function () { var el = document.getElementById(r.anchor); if (el) el.scrollIntoView(); }, 60);
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); }
  go() {
    var prev = this.state.route, r = parseRoute(location.hash);
    this.playIntro = false;
    this.setState({route: r}, function () {
      if (r.anchor) { var el = document.getElementById(r.anchor); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }
      else if (r.view !== prev.view || r.tab !== prev.tab || prev.anchor) window.scrollTo(0, 0);
    });
    this.paint(r);
  }
  setDark(d) {
    var self = this;
    try { localStorage.setItem('acrf-theme', d ? 'dark' : 'light'); } catch (err) { /* storage can be unavailable */ }
    this.setState({dark: d}, function () { self.paint(); });
  }
  paint(route) {
    var d = this.state.dark, r = route || this.state.route;
    document.documentElement.style.colorScheme = d ? 'dark' : 'light';
    document.body.style.background = d ? '#0b1019' : '#ffffff';
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', d ? '#0b1019' : '#ffffff');
    document.title = r.view === 'dash' ? 'ACRF dashboard · ' + TITLES[r.tab] : r.view === 'profile' ? 'Debo Jolaoso · Creator of ACRF' : 'ACRF · Safety stock sized to the data you have';
  }
  render() {
    var r = this.state.route;
    if (r.view === 'dash') return html`<${Dashboard} key="dash" tab=${r.tab} dark=${this.state.dark} onTheme=${this.setDark} logo=${LOGO} />`;
    if (r.view === 'profile') return html`<${Profile} key="profile" dark=${this.state.dark} onTheme=${this.setDark} logo=${LOGO} />`;
    return html`<${Landing} key="landing" dark=${this.state.dark} onTheme=${this.setDark} logo=${LOGO} intro=${this.playIntro} />`;
  }
}
render(html`<${App} />`, document.getElementById('app'));
})();
</script>
